<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HSG Kamera</title>
<style>
  :root { --red:#d01818; --bg:#0b0b0c; --fg:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  header { padding:10px 16px 6px; font-size:13px; opacity:.75; text-align:center; }
  .frame { position:relative; aspect-ratio:4/5; height:min(calc(100dvh - 190px), 125vw);
    max-width:100vw; background:#222; overflow:hidden; border-radius:12px; }
  video, #shot { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  svg#ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #shot { display:none; }
  .controls { width:100%; max-width:480px; padding:12px 18px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  button { font:inherit; color:var(--fg); background:#2a2a2d; border:0; border-radius:12px; padding:12px 16px; font-size:15px; }
  button.primary { background:var(--red); font-weight:600; flex:1; }
  #shutter { width:72px; height:72px; border-radius:50%; background:#fff; border:5px solid #555; padding:0; }
  #shutter:active { background:#ddd; }
  label { font-size:13px; opacity:.8; display:flex; align-items:center; gap:8px; flex:1; }
  input[type=range] { flex:1; accent-color:var(--red); }
  #info { font-size:12px; opacity:.7; text-align:center; min-height:16px; }
  #msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center;
    padding:24px; font-size:15px; background:#111; }
  .hide { display:none !important; }
</style>
</head>
<body>
<header>Alle Personen müssen im freien Bereich stehen – nicht unter den roten Flächen.</header>

<div class="frame">
  <video id="cam" autoplay playsinline muted></video>
  <img id="shot" alt="Aufgenommenes Foto">
  <svg id="ov" viewBox="0 0 1080 1350" preserveAspectRatio="none" aria-hidden="true">
    <g id="layout"></g>
  </svg>
  <div id="msg"></div>
</div>

<div class="controls">
  <div id="liveCtl">
    <div class="row" style="margin-bottom:12px">
      <label>Layout <input type="range" id="op" min="0" max="100" value="70"></label>
      <button id="toggle">Aus</button>
      <button id="flip">⟲ Kamera</button>
    </div>
    <div class="row" style="justify-content:center">
      <button id="shutter" aria-label="Foto aufnehmen"></button>
    </div>
  </div>
  <div id="resCtl" class="row hide">
    <button id="again">Neu aufnehmen</button>
    <button id="save" class="primary">Speichern / Teilen</button>
  </div>
  <div id="info"></div>
</div>

<canvas id="cv" class="hide"></canvas>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cam=$('cam'), shot=$('shot'), msg=$('msg'), info=$('info'), layout=$('layout');
  var facing='environment', stream=null, lastBlob=null, lastURL=null, overlayOn=true;

  // ---- Layout als SVG nachbauen (Koordinaten der 1080x1350-Vorlage) ----
  var s='';
  // Große „HSG“-Buchstaben (rosa)
  s+='<g fill="#e8999a" fill-opacity=".8">'
   +'<rect x="225" y="715" width="78" height="365"/><rect x="341" y="715" width="78" height="365"/>'
   +'<rect x="225" y="715" width="194" height="143" fill-opacity="0"/>'
   +'<rect x="432" y="712" width="190" height="368" rx="80"/><rect x="634" y="712" width="196" height="368" rx="80"/></g>';
  // Spielstand-Boxen
  s+='<rect x="217" y="906" width="424" height="151" fill="#fff" fill-opacity=".75"/>'
   +'<rect x="641" y="906" width="208" height="151" fill="#797170" fill-opacity=".9"/>'
   +'<rect x="217" y="1080" width="424" height="202" fill="#fff" fill-opacity=".75"/>'
   +'<rect x="641" y="1080" width="208" height="202" fill="#d01818" fill-opacity=".9"/>';
  s+='<text x="429" y="1002" font-family="Impact,Arial Narrow,sans-serif" font-weight="800" font-size="56" text-anchor="middle" fill="#000">SG TEUTO HANDBALL</text>';
  s+='<text x="745" y="1012" font-family="Impact,Arial Narrow,sans-serif" font-weight="800" font-size="96" text-anchor="middle" fill="#fff">16</text>';
  s+='<text x="745" y="1226" font-family="Impact,Arial Narrow,sans-serif" font-weight="800" font-size="96" text-anchor="middle" fill="#fff">28</text>';
  s+='<rect x="389" y="1112" width="106" height="144" fill="#d01818"/>'
   +'<text x="442" y="1235" font-family="Arial" font-weight="900" font-style="italic" font-size="42" text-anchor="middle" fill="#fff">HSG</text>';
  // Jahreszahl & Liga
  s+='<g font-family="Impact,Arial Narrow,sans-serif" font-weight="800" font-size="104" fill="#d01818" text-anchor="middle">'
   +'<text x="989" y="325">20</text><text x="989" y="412">27</text></g>';
  s+='<text x="64" y="82" font-family="Arial,sans-serif" font-weight="700" font-size="30" fill="#fff" stroke="#000" stroke-opacity=".5" stroke-width="1.5">REGIONSOBERLIGA</text>';
  // Punkte unten links
  var d='';
  for(var gy=930,r=0; gy<1360; gy+=52,r++){
    for(var gx=(r%2?20:46); gx<880; gx+=52){
      var dist=Math.hypot(gx-330, gy-1420), rad=30*(1-dist/640);
      if(rad>2.5) d+='<circle cx="'+gx+'" cy="'+gy+'" r="'+rad.toFixed(1)+'"/>';
    }
  }
  s+='<g fill="#d01818" fill-opacity=".9">'+d+'</g>';
  layout.innerHTML=s;

  // ---- Bedienung Overlay ----
  $('op').oninput=function(){ layout.style.opacity=this.value/100; };
  layout.style.opacity=.7;
  $('toggle').onclick=function(){
    overlayOn=!overlayOn; layout.style.display=overlayOn?'':'none';
    this.textContent=overlayOn?'Aus':'An';
  };

  // ---- Kamera ----
  function showMsg(t){ msg.style.display='flex'; msg.textContent=t; }
  function stop(){ if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream=null; } }
  async function start(){
    stop(); msg.style.display='none';
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      showMsg('Kamerazugriff nicht möglich. Bitte die Seite über https:// öffnen (z. B. auf deiner Website) und in Safari/Chrome nutzen.'); return;
    }
    var tries=[
      {video:{facingMode:{ideal:facing},width:{ideal:4096},height:{ideal:4096}},audio:false},
      {video:{facingMode:{ideal:facing}},audio:false},
      {video:true,audio:false}
    ];
    for(var i=0;i<tries.length;i++){
      try{ stream=await navigator.mediaDevices.getUserMedia(tries[i]); break; }catch(e){ stream=null; }
    }
    if(!stream){ showMsg('Kein Kamerazugriff. Bitte die Berechtigung für die Kamera erlauben und die Seite neu laden.'); return; }
    cam.srcObject=stream;
    cam.onloadedmetadata=function(){ info.textContent='Kamera: '+cam.videoWidth+' × '+cam.videoHeight+' px'; };
  }
  $('flip').onclick=function(){ facing=facing==='environment'?'user':'environment'; start(); };

  // ---- Aufnehmen (ohne Layout, 4:5 zugeschnitten, volle Auflösung) ----
  $('shutter').onclick=function(){
    var vw=cam.videoWidth, vh=cam.videoHeight; if(!vw||!vh) return;
    var ratio=4/5, sx=0, sy=0, sw=vw, sh=vh;
    if(vw/vh>ratio){ sw=Math.round(vh*ratio); sx=Math.round((vw-sw)/2); }
    else { sh=Math.round(vw/ratio); sy=Math.round((vh-sh)/2); }
    var cv=$('cv'); cv.width=sw; cv.height=sh;
    cv.getContext('2d').drawImage(cam,sx,sy,sw,sh,0,0,sw,sh);
    cv.toBlob(function(b){
      if(!b){ info.textContent='Aufnahme fehlgeschlagen.'; return; }
      lastBlob=b; if(lastURL) URL.revokeObjectURL(lastURL);
      lastURL=URL.createObjectURL(b); shot.src=lastURL;
      shot.style.display='block'; cam.style.display='none'; $('ov').style.display='none';
      $('liveCtl').classList.add('hide'); $('resCtl').classList.remove('hide');
      info.textContent='Gespeichert wird ohne Layout: '+sw+' × '+sh+' px ('+(b.size/1048576).toFixed(1)+' MB)';
    },'image/jpeg',0.97);
  };

  $('again').onclick=function(){
    shot.style.display='none'; cam.style.display='block'; $('ov').style.display='block';
    $('resCtl').classList.add('hide'); $('liveCtl').classList.remove('hide');
    info.textContent='Kamera: '+cam.videoWidth+' × '+cam.videoHeight+' px';
  };

  $('save').onclick=async function(){
    if(!lastBlob) return;
    var d=new Date(), p=function(n){return String(n).padStart(2,'0');};
    var name='HSG_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.jpg';
    var file=new File([lastBlob],name,{type:'image/jpeg'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    }catch(e){ if(e&&e.name==='AbortError') return; }
    var a=document.createElement('a'); a.href=lastURL; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  };

  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stop(); else if(shot.style.display!=='block') start();
  });
  start();
})();
</script>
</body>
</html>
